services:
  db:
    image: postgres:15-alpine
    container_name: segueemr-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: segueemr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d segueemr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: segueemr-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/segueemr_db?schema=public
      - JWT_SECRET=your_jwt_secret_key_here
      - JWT_EXPIRES_IN=24h
      - AZURE_STORAGE_CONNECTION_STRING=UseDevelopmentStorage=true
      - AZURE_STORAGE_CONTAINER_NAME=medical-records
      - DATAVERSE_ENVIRONMENT_URL=https://your-org.crm.dynamics.com
      - DATAVERSE_CLIENT_ID=your_client_id
      - DATAVERSE_CLIENT_SECRET=your_client_secret
      - DATAVERSE_TENANT_ID=your_tenant_id
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: segueemr-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
